<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Comparison Studio | Dark (Draft 1) vs Light (Draft 2)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="h-16 border-b border-slate-800 bg-slate-950/90 backdrop-blur-md px-6 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-white">
                <i data-lucide="columns" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white flex items-center gap-2">
                    <span>Visual Comparison Studio</span>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800">Team Review</span>
                </h1>
                <p class="text-[11px] text-slate-400 font-mono">Compare Draft 1 (Dark Theme) vs Draft 2 (Light Theme)</p>
            </div>
        </div>

        <!-- View Switcher Tabs -->
        <div class="flex items-center space-x-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-medium">
            <button onclick="switchView('presentation')" id="tabPresentation" class="view-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-bold transition">
                SIH Presentation
            </button>
            <button onclick="switchView('dashboard')" id="tabDashboard" class="view-tab px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
                Fleet Dashboard
            </button>
            <button onclick="switchView('quantum')" id="tabQuantum" class="view-tab px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
                Quantum Maps
            </button>
        </div>

        <!-- Quick Links Direct Buttons -->
        <div class="flex items-center space-x-2 text-xs">
            <a id="openDraft1External" href="sih_presentation_draft1.html" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold flex items-center space-x-1 transition">
                <span>Open Dark</span>
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
            </a>
            <a id="openDraft2External" href="sih_presentation_draft2.html" target="_blank" class="px-3 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-500 text-white font-bold flex items-center space-x-1 transition shadow-sm">
                <span>Open Light</span>
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
            </a>
        </div>
    </header>

    <!-- Side-by-Side Split Workspace -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- LEFT: DRAFT 1 (Dark Theme) -->
        <div class="flex-1 flex flex-col border-b lg:border-b-0 lg:border-r border-slate-800 bg-slate-950">
            <div class="h-10 bg-slate-900/90 border-b border-slate-800 px-4 flex items-center justify-between text-xs">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
                    <span class="font-bold text-slate-200 font-mono uppercase tracking-wider">Draft 1 &bull; Dark Theme (Original)</span>
                </div>
                <a id="linkDraft1" href="sih_presentation_draft1.html" target="_blank" class="text-[11px] text-cyan-400 hover:underline flex items-center gap-1 font-mono">
                    <span>Full Window</span>
                    <i data-lucide="maximize-2" class="w-3 h-3"></i>
                </a>
            </div>
            <div class="flex-1 relative bg-slate-950">
                <iframe id="iframeDraft1" src="sih_presentation_draft1.html" class="w-full h-full border-0 absolute inset-0"></iframe>
            </div>
        </div>

        <!-- RIGHT: DRAFT 2 (Light Theme) -->
        <div class="flex-1 flex flex-col bg-slate-100">
            <div class="h-10 bg-white border-b border-slate-200 px-4 flex items-center justify-between text-xs text-slate-800">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-teal-600"></span>
                    <span class="font-bold text-teal-900 font-mono uppercase tracking-wider">Draft 2 &bull; Light Theme (Executive Studio)</span>
                </div>
                <a id="linkDraft2" href="sih_presentation_draft2.html" target="_blank" class="text-[11px] text-teal-700 hover:underline flex items-center gap-1 font-mono">
                    <span>Full Window</span>
                    <i data-lucide="maximize-2" class="w-3 h-3"></i>
                </a>
            </div>
            <div class="flex-1 relative bg-slate-50">
                <iframe id="iframeDraft2" src="sih_presentation_draft2.html" class="w-full h-full border-0 absolute inset-0"></iframe>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        const VIEWS = {
            presentation: {
                draft1: 'sih_presentation_draft1.html',
                draft2: 'sih_presentation_draft2.html'
            },
            dashboard: {
                draft1: 'dashboard_draft1.html',
                draft2: 'dashboard_draft2.html'
            },
            quantum: {
                draft1: 'quantum_draft1.html',
                draft2: 'quantum_draft2.html'
            }
        };

        let currentView = 'presentation';

        function switchView(viewKey) {
            currentView = viewKey;
            const cfg = VIEWS[viewKey];

            // Update iframes
            document.getElementById('iframeDraft1').src = cfg.draft1;
            document.getElementById('iframeDraft2').src = cfg.draft2;

            // Update external buttons
            document.getElementById('linkDraft1').href = cfg.draft1;
            document.getElementById('linkDraft2').href = cfg.draft2;
            document.getElementById('openDraft1External').href = cfg.draft1;
            document.getElementById('openDraft2External').href = cfg.draft2;

            // Update tab styles
            document.querySelectorAll('.view-tab').forEach(tab => {
                tab.className = 'view-tab px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
            });
            if (viewKey === 'presentation') {
                document.getElementById('tabPresentation').className = 'view-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-bold transition';
            } else if (viewKey === 'dashboard') {
                document.getElementById('tabDashboard').className = 'view-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-bold transition';
            } else if (viewKey === 'quantum') {
                document.getElementById('tabQuantum').className = 'view-tab px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-bold transition';
            }
        }
    </script>
</body>
</html>
